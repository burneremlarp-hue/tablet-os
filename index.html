<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablet OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* Custom Scrollbar & Utility Classes */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

    /* Toast Slide Animations */
    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes slideUpOut {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-120%); opacity: 0; }
    }
    .animate-toast-in { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-toast-out { animation: slideUpOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Dynamic Wallpapers */
    .wallpaper-emerald-cyan { background: linear-gradient(135deg, #059669 0%, #0891b2 100%); }
    .wallpaper-sunset-purple { background: linear-gradient(135deg, #4c1d95 0%, #c026d3 50%, #f43f5e 100%); }
    .wallpaper-midnight-dark { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }
    .wallpaper-ocean-blue { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden select-none font-sans text-white wallpaper-emerald-cyan transition-all duration-500" id="os-body">

  <!-- TOP LEFT DOWNLOAD TOAST NOTIFICATION -->
  <div id="toast-container" class="fixed top-4 left-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- MAIN DESKTOP WORKSPACE -->
  <main class="h-full w-full relative p-6 flex flex-col justify-between">
    
    <!-- APP GRID -->
    <div id="app-grid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-6 max-w-5xl">
      <!-- Default Built-In Apps -->
      <button onclick="openApp('appstore')" class="flex flex-col items-center gap-2 group">
        <div class="w-16 h-16 rounded-2xl bg-blue-600/80 backdrop-blur-md flex items-center justify-center text-2xl shadow-lg group-hover:scale-105 transition-transform border border-white/20">
          <i class="fa-solid fa-bag-shopping"></i>
        </div>
        <span class="text-xs font-medium drop-shadow">App Store</span>
      </button>

      <button onclick="openApp('settings')" class="flex flex-col items-center gap-2 group">
        <div class="w-16 h-16 rounded-2xl bg-slate-700/80 backdrop-blur-md flex items-center justify-center text-2xl shadow-lg group-hover:scale-105 transition-transform border border-white/20">
          <i class="fa-solid fa-gear"></i>
        </div>
        <span class="text-xs font-medium drop-shadow">Settings</span>
      </button>
    </div>

    <!-- WINDOW CONTAINERS FOR OPEN APPS -->
    <div id="window-container" class="absolute inset-0 pointer-events-none z-20"></div>

    <!-- BOTTOM TASKBAR / DOCK -->
    <footer class="w-full flex items-center justify-between z-30">
      
      <!-- BOTTOM LEFT: ACTIVE TAB / APP MANAGER -->
      <div class="relative">
        <button onclick="toggleTabMenu()" class="px-3 py-2 rounded-xl bg-black/40 backdrop-blur-md border border-white/15 flex items-center gap-2 hover:bg-black/60 transition text-xs font-semibold">
          <i class="fa-solid fa-layer-group text-cyan-400"></i>
          <span id="tab-count-label">0 Open</span>
        </button>

        <!-- OPEN TABS POPUP MENU -->
        <div id="tab-menu" class="hidden absolute bottom-12 left-0 w-64 bg-slate-900/90 backdrop-blur-xl border border-white/20 rounded-2xl p-3 shadow-2xl flex flex-col gap-2 z-50">
          <div class="text-xs font-bold text-slate-400 px-2 pb-1 border-b border-white/10 flex justify-between items-center">
            <span>Background Tabs</span>
            <button onclick="toggleTabMenu()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div id="tab-list" class="flex flex-col gap-1 max-h-48 overflow-y-auto">
            <span class="text-xs text-slate-500 italic p-2 text-center">No apps or tabs open</span>
          </div>
        </div>
      </div>

      <!-- DOCK APPS -->
      <div class="flex items-center gap-4 px-6 py-3 rounded-3xl bg-white/10 backdrop-blur-xl border border-white/20 shadow-2xl">
        <button onclick="openApp('appstore')" class="w-12 h-12 rounded-xl bg-blue-600/80 flex items-center justify-center text-xl hover:scale-110 transition border border-white/20">
          <i class="fa-solid fa-bag-shopping"></i>
        </button>
        <button onclick="openApp('settings')" class="w-12 h-12 rounded-xl bg-slate-700/80 flex items-center justify-center text-xl hover:scale-110 transition border border-white/20">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>

      <div></div>
    </footer>
  </main>

  <!-- BUILT-IN APP WINDOW TEMPLATES -->
  
  <!-- APP STORE WINDOW -->
  <div id="app-appstore" class="hidden absolute inset-8 bg-slate-900/95 backdrop-blur-2xl rounded-3xl border border-white/20 shadow-2xl flex-col overflow-hidden z-30 pointer-events-auto">
    <div class="p-4 bg-white/5 border-b border-white/10 flex items-center justify-between">
      <div class="flex items-center gap-2 font-bold"><i class="fa-solid fa-bag-shopping text-blue-400"></i> App Store</div>
      <button onclick="closeApp('appstore')" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto">
      
      <!-- MAIL APP STORE ITEM -->
      <div class="p-4 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl bg-emerald-600 flex items-center justify-center text-xl"><i class="fa-solid fa-envelope"></i></div>
          <div>
            <div class="font-bold text-sm">Mail</div>
            <div class="text-xs text-slate-400">edumail.su</div>
          </div>
        </div>
        <button id="btn-install-mail" onclick="triggerAppDownload('mail', 'Mail', 'fa-solid fa-envelope bg-emerald-600', 'https://edumail.su/')" class="px-4 py-1.5 rounded-full bg-blue-500 hover:bg-blue-600 text-xs font-bold transition">Get</button>
      </div>

    </div>
  </div>

  <!-- SETTINGS WINDOW -->
  <div id="app-settings" class="hidden absolute inset-8 bg-slate-900/95 backdrop-blur-2xl rounded-3xl border border-white/20 shadow-2xl flex-col overflow-hidden z-30 pointer-events-auto">
    <div class="p-4 bg-white/5 border-b border-white/10 flex items-center justify-between">
      <div class="flex items-center gap-2 font-bold"><i class="fa-solid fa-gear text-slate-400"></i> Settings</div>
      <button onclick="closeApp('settings')" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-6 space-y-6 overflow-y-auto">
      <div>
        <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Wallpapers</h3>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
          <button onclick="setWallpaper('wallpaper-emerald-cyan')" class="h-20 rounded-xl wallpaper-emerald-cyan border-2 border-white/30 hover:scale-105 transition flex items-end p-2 text-xs font-bold">Emerald Cyan</button>
          <button onclick="setWallpaper('wallpaper-sunset-purple')" class="h-20 rounded-xl wallpaper-sunset-purple border-2 border-white/30 hover:scale-105 transition flex items-end p-2 text-xs font-bold">Sunset Purple</button>
          <button onclick="setWallpaper('wallpaper-midnight-dark')" class="h-20 rounded-xl wallpaper-midnight-dark border-2 border-white/30 hover:scale-105 transition flex items-end p-2 text-xs font-bold">Midnight Dark</button>
          <button onclick="setWallpaper('wallpaper-ocean-blue')" class="h-20 rounded-xl wallpaper-ocean-blue border-2 border-white/30 hover:scale-105 transition flex items-end p-2 text-xs font-bold">Ocean Blue</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT SYSTEM ENGINE -->
  <script>
    const VERCEL_API_URL = 'https://tablet-54t26z902-tablet3.vercel.app/api/workspace';

    let currentWallpaper = 'wallpaper-emerald-cyan';
    const appStates = {}; // Stores installed apps
    const openTabs = [];  // Track active background tabs

    // --- SYSTEM INITIALIZATION & SUPABASE BACKEND SYNC ---
    async function loadStateFromBackend() {
      try {
        const res = await fetch(VERCEL_API_URL);
        const data = await res.json();

        if (data && data.wallpaper) {
          setWallpaper(data.wallpaper);
        }
        if (data && data.installed_apps) {
          data.installed_apps.forEach(app => {
            installAppToWorkspace(app.id, app.title, app.iconClass, app.targetUrl, false);
          });
        }
      } catch (err) {
        console.warn('Backend sync unavailable, using local session.', err);
      }
    }

    async function saveStateToBackend() {
      try {
        const installed = Object.values(appStates).filter(a => a.installed);
        await fetch(VERCEL_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            installed_apps: installed,
            open_tabs: openTabs,
            wallpaper: currentWallpaper
          })
        });
      } catch (err) {
        console.error('Failed to sync to Supabase backend:', err);
      }
    }

    // --- WALLPAPER MANAGER ---
    function setWallpaper(classStr) {
      const body = document.getElementById('os-body');
      body.className = body.className.replace(/wallpaper-\S+/g, '');
      body.classList.add(classStr);
      currentWallpaper = classStr;
      saveStateToBackend();
    }

    // --- TOAST NOTIFICATIONS (WITH SLIDE-UP ANIMATION) ---
    function showDownloadToast(appName, iconClass) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto px-4 py-3 rounded-2xl bg-slate-900/90 backdrop-blur-xl border border-white/20 shadow-2xl flex items-center gap-3 animate-toast-in';
      
      toast.innerHTML = `
        <div class="w-8 h-8 rounded-lg flex items-center justify-center text-sm ${iconClass}"></div>
        <div class="flex flex-col">
          <span class="text-xs font-bold">Downloading ${appName}...</span>
          <span class="text-[10px] text-slate-400">Installing application</span>
        </div>
      `;

      container.appendChild(toast);

      // Slide up close after 2.5 seconds
      setTimeout(() => {
        toast.classList.remove('animate-toast-in');
        toast.classList.add('animate-toast-out');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // --- APP STORE & INSTALLATION ENGINE ---
    function triggerAppDownload(id, title, iconClass, targetUrl) {
      showDownloadToast(title, iconClass);
      const btn = document.getElementById(`btn-install-${id}`);
      if (btn) {
        btn.disabled = true;
        btn.innerText = 'Installing...';
        btn.className = 'px-4 py-1.5 rounded-full bg-slate-700 text-slate-400 text-xs font-bold';
      }

      setTimeout(() => {
        installAppToWorkspace(id, title, iconClass, targetUrl, true);
        if (btn) btn.innerText = 'Open';
      }, 2800);
    }

    function installAppToWorkspace(id, title, iconClass, targetUrl, shouldSave = true) {
      if (appStates[id]?.installed) return;

      appStates[id] = { id, title, iconClass, targetUrl, installed: true };

      // Add to desktop grid
      const grid = document.getElementById('app-grid');
      const appBtn = document.createElement('button');
      appBtn.id = `app-icon-${id}`;
      appBtn.onclick = () => openIframeApp(id, title, targetUrl);
      appBtn.className = 'flex flex-col items-center gap-2 group';
      appBtn.innerHTML = `
        <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-2xl shadow-lg group-hover:scale-105 transition-transform border border-white/20 ${iconClass}"></div>
        <span class="text-xs font-medium drop-shadow">${title}</span>
      `;
      grid.appendChild(appBtn);

      if (shouldSave) saveStateToBackend();
    }

    // --- APP WINDOW & TAB MANAGEMENT ---
    function openApp(id) {
      const el = document.getElementById(`app-${id}`);
      if (el) {
        el.classList.remove('hidden');
        el.classList.add('flex');
        registerTab(id, id.toUpperCase(), 'app');
      }
    }

    function closeApp(id) {
      const el = document.getElementById(`app-${id}`);
      if (el) {
        el.classList.add('hidden');
        el.classList.remove('flex');
        unregisterTab(id);
      }
    }

    function openIframeApp(id, title, url) {
      let win = document.getElementById(`app-win-${id}`);
      if (!win) {
        win = document.createElement('div');
        win.id = `app-win-${id}`;
        win.className = 'absolute inset-8 bg-slate-900/95 backdrop-blur-2xl rounded-3xl border border-white/20 shadow-2xl flex flex-col overflow-hidden z-30 pointer-events-auto';
        win.innerHTML = `
          <div class="p-4 bg-white/5 border-b border-white/10 flex items-center justify-between">
            <div class="flex items-center gap-2 font-bold text-sm"><i class="fa-solid fa-globe text-cyan-400"></i> ${title}</div>
            <button onclick="closeIframeApp('${id}')" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <iframe src="${url}" class="w-full h-full border-none bg-white"></iframe>
        `;
        document.getElementById('window-container').appendChild(win);
      } else {
        win.classList.remove('hidden');
      }
      registerTab(id, title, 'iframe');
    }

    function closeIframeApp(id) {
      const win = document.getElementById(`app-win-${id}`);
      if (win) {
        win.classList.add('hidden');
        unregisterTab(id);
      }
    }

    // --- TABS MENU CONTROLLER ---
    function registerTab(id, title, type) {
      if (!openTabs.find(t => t.id === id)) {
        openTabs.push({ id, title, type });
        updateTabUI();
        saveStateToBackend();
      }
    }

    function unregisterTab(id) {
      const idx = openTabs.findIndex(t => t.id === id);
      if (idx !== -1) {
        openTabs.splice(idx, 1);
        updateTabUI();
        saveStateToBackend();
      }
    }

    function updateTabUI() {
      const label = document.getElementById('tab-count-label');
      const list = document.getElementById('tab-list');
      label.innerText = `${openTabs.length} Open`;

      if (openTabs.length === 0) {
        list.innerHTML = `<span class="text-xs text-slate-500 italic p-2 text-center">No apps or tabs open</span>`;
        return;
      }

      list.innerHTML = openTabs.map(t => `
        <div class="flex items-center justify-between p-2 rounded-xl bg-white/5 hover:bg-white/10 transition text-xs">
          <span class="truncate font-medium">${t.title}</span>
          <button onclick="${t.type === 'iframe' ? `closeIframeApp('${t.id}')` : `closeApp('${t.id}')`}" class="text-slate-400 hover:text-red-400 px-1"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `).join('');
    }

    function toggleTabMenu() {
      document.getElementById('tab-menu').classList.toggle('hidden');
    }

    // --- BOOT EVENT ---
    window.addEventListener('DOMContentLoaded', loadStateFromBackend);
  </script>
</body>
</html>
